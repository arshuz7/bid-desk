[project]
name = "bidesk"
version = "0.1.0"
description = "A governed AI pipeline over Alberta construction tenders"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.1.0",
    "httpx2>=2.16",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14",
    "pymupdf==1.26.5",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Docs and versioned prompts are Markdown; ruff must not rewrite code blocks in them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["db: needs the local Postgres from `make db-up`; excluded from `make test`"]

[tool.importlinter]
root_package = "bidesk"

[[tool.importlinter.contracts]]
name = "Imports point downward through the layers in CLAUDE.md"
type = "layers"
containers = ["bidesk"]
# Parentheses mark layers that don't exist yet.
layers = [
    "(api) | cli",
    "evals",
    "(pipeline)",
    "governance",
    "ingest | retrieval",
    "llm",
    "db | tracing",
    "config | schemas | manifest",
]
