name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: make test
      - run: make validate-labels

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: bidesk
          POSTGRES_PASSWORD: bidesk
          POSTGRES_DB: bidesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidesk -d bidesk"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://bidesk:bidesk@localhost:5432/bidesk
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: make migrate
      - run: make migrate
      - run: make test-db
